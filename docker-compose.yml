version: "3.8"
services:
  # --- Local MongoDB ---
  mongodb:
    image: mongo:8.0
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.25"]
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mongosh --quiet --eval ''db.adminCommand("ping").ok'' localhost:27017/test',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:27017:27017"
    networks:
      - crypto-network

  # --- Java Spring Boot Backend ---
  backend:
    build: ./backend
    # Resolved from .env.local when Compose is started with --env-file.
    environment:
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongodb:27017/crypto_db}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-crypto_db}
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx256m -XX:+UseG1GC"
    ports:
      - "8080:8080"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - crypto-network

  # --- Python LSTM Predictor ---
  lstm-predictor:
    build: ./microservices/ltsm-predictor-service
    # Uses the same MongoDB connection as the backend.
    environment:
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongodb:27017/crypto_db}
      TF_NUM_INTRAOP_THREADS: "1"
      TF_NUM_INTEROP_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      MALLOC_ARENA_MAX: "2"
    ports:
      - "8081:8081"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - crypto-network

  # --- Python Technical Analysis ---
  technical-analysis:
    build: ./microservices/technical-analysis-service
    container_name: technical-analysis-service
    environment:
      MALLOC_ARENA_MAX: "2"
    ports:
      - "8082:8082"
    networks:
      - crypto-network

  # --- React Frontend ---
  frontend:
    build:
      context: ./frontend
      args:
        - VITE_APP_API_URL=/api/coins
        - VITE_EXPORT_API_URL=/api/export
        - VITE_MICROSERVICES_API_URL=/api/microservices
    ports:
      - "3000:80"
    networks:
      - crypto-network
    depends_on:
      - backend

networks:
  crypto-network:
    driver: bridge

volumes:
  mongodb-data:
