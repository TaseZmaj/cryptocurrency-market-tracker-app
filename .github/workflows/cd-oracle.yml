name: CD - Deploy to Oracle Cloud

on:
  workflow_run:
    workflows:
      - CI - Publish Docker Images
    types:
      - completed
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      image_tag:
        description: Docker image tag to deploy
        required: false
        type: string

permissions:
  contents: read

env:
  REGISTRY: docker.io

jobs:
  deploy:
    name: Deploy production stack
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check out deployment configuration
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Configure SSH
        env:
          OCI_SSH_PRIVATE_KEY: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          OCI_HOST: ${{ secrets.OCI_HOST }}
        run: |
          set -eu
          test -n "$OCI_SSH_PRIVATE_KEY"
          test -n "$OCI_HOST"
          install -m 700 -d "$HOME/.ssh"
          key_material="$(printf '%s' "$OCI_SSH_PRIVATE_KEY" | tr -d '\r')"
          if printf '%s' "$key_material" | grep -q '\\n'; then
            key_material="$(printf '%s' "$key_material" | perl -0pe 's/\\n/\n/g')"
          fi
          printf '%s\n' "$key_material" > "$HOME/.ssh/oci_key"
          chmod 600 "$HOME/.ssh/oci_key"
          if ! ssh-keygen -yf "$HOME/.ssh/oci_key" > /dev/null; then
            echo "OCI_SSH_PRIVATE_KEY is not a readable private SSH key." >&2
            echo "Store the complete unencrypted private key, including BEGIN/END lines, as a multiline GitHub secret." >&2
            exit 1
          fi
          ssh-keyscan -H "$OCI_HOST" >> "$HOME/.ssh/known_hosts"

      - name: Upload production Compose file
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_USER: ${{ secrets.OCI_USER }}
          DOMAIN: ${{ vars.DOMAIN }}
          ACME_EMAIL: ${{ vars.ACME_EMAIL }}
        run: |
          set -eu
          test -n "$OCI_USER"
          ssh -i "$HOME/.ssh/oci_key" "$OCI_USER@$OCI_HOST" \
            'mkdir -p "$HOME/crypto-market-tracker/caddy"'
          scp -i "$HOME/.ssh/oci_key" docker-compose.prod.yml \
            "$OCI_USER@$OCI_HOST:~/crypto-market-tracker/docker-compose.prod.yml"
          scp -i "$HOME/.ssh/oci_key" caddy/Caddyfile \
            "$OCI_USER@$OCI_HOST:~/crypto-market-tracker/caddy/Caddyfile"

      - name: Pull and restart services
        env:
          IMAGE_NAMESPACE: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ github.event_name == 'workflow_run' && format('sha-{0}', github.event.workflow_run.head_sha) || inputs.image_tag || format('sha-{0}', github.sha) }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_USER: ${{ secrets.OCI_USER }}
          DOMAIN: ${{ vars.DOMAIN }}
          ACME_EMAIL: ${{ vars.ACME_EMAIL }}
        run: |
          set -eu
          test -n "$IMAGE_NAMESPACE"
          test -n "$IMAGE_TAG"
          test -n "$DOCKERHUB_TOKEN"
          test -n "$MONGODB_URI"
          test -n "$DOMAIN"
          test -n "$ACME_EMAIL"
          printf '%s' "$DOCKERHUB_TOKEN" | ssh -i "$HOME/.ssh/oci_key" "$OCI_USER@$OCI_HOST" \
            "docker login $REGISTRY --username '$IMAGE_NAMESPACE' --password-stdin"
          mongodb_uri_b64="$(printf '%s' "$MONGODB_URI" | base64 -w 0)"
          ssh -i "$HOME/.ssh/oci_key" "$OCI_USER@$OCI_HOST" \
            "IMAGE_NAMESPACE='$IMAGE_NAMESPACE' IMAGE_TAG='$IMAGE_TAG' MONGODB_URI_B64='$mongodb_uri_b64' DOMAIN='$DOMAIN' ACME_EMAIL='$ACME_EMAIL' bash -s" <<'REMOTE_SCRIPT'
          set -eu
          cd "$HOME/crypto-market-tracker"
          diagnostics() {
            docker compose --env-file .env.prod -f docker-compose.prod.yml ps
            docker compose --env-file .env.prod -f docker-compose.prod.yml logs --tail=100 backend frontend
          }
          trap diagnostics ERR
          printf 'IMAGE_NAMESPACE=%s\nIMAGE_TAG=%s\nMONGODB_DATABASE=crypto_db\nDOMAIN=%s\nACME_EMAIL=%s\n' \
            "$IMAGE_NAMESPACE" "$IMAGE_TAG" "$DOMAIN" "$ACME_EMAIL" > .env.prod
          printf 'MONGODB_URI=' >> .env.prod
          printf '%s' "$MONGODB_URI_B64" | base64 --decode >> .env.prod
          printf '\n' >> .env.prod
          docker compose --env-file .env.prod -f docker-compose.prod.yml pull
          docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --force-recreate --remove-orphans
          api_ready=0
          for attempt in $(seq 1 42); do
            if curl --fail --silent --show-error --max-time 15 \
                --resolve "$DOMAIN:443:127.0.0.1" --insecure \
                "https://$DOMAIN/api/coins" > /dev/null; then
              api_ready=1
              break
            fi
            echo "API is not ready yet (attempt $attempt/42); waiting 5 seconds..."
            sleep 5
          done
          test "$api_ready" -eq 1
          docker compose --env-file .env.prod -f docker-compose.prod.yml ps
          docker image prune -f
          REMOTE_SCRIPT
